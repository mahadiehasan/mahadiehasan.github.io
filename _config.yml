name: Mahadie Hasan Jahad
tagline: Pharmacy | Public Health | Molecular Genetics | Biomedical Research
career-objective: I am a pharmacy graduate and public health professional with a strong
  interdisciplinary research background in molecular biology, cancer
  molecular epidemiology, pharmacogenomics, and precision medicine.
  Currently working as a Research Assistant at Rufaida BioMeds, I contribute
  to molecular research involving SNP genotyping, PCR-based assays,
  molecular biomarkers, and cancer susceptibility in Bangladeshi populations.
  My academic background includes a Bachelor of Pharmacy and a Master of
  Public Health, complemented by research, teaching, pharmaceutical industry,
  and data analytics experience. My long-term goal is to advance translational
  biomedical research by integrating molecular laboratory investigations,
  epidemiological approaches, and computational methods to address
  significant health challenges.
 Fork <a href="https://github.com/academicportfolio/academicportfolio.github.io">this repository</a> to get started. This section will be replaced by your career objective. Read the README of the repository to learn about customizing the site.
